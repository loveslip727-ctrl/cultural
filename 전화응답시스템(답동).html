```html
<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>영종복합문화센터 길찾기</title>

    <style>
        body {
            font-family: 'Malgun Gothic', sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            background-color: #f4f4f4;
        }

        .message-box {
            background-color: white;
            padding: 25px;
            border-radius: 12px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.12);
            text-align: center;
            max-width: 330px;
            width: 85%;
        }

        h3 {
            margin-top: 0;
            font-size: 22px;
        }

        .destination {
            font-size: 20px;
            font-weight: bold;
        }

        .loading {
            margin-top: 20px;
            color: #555;
            font-size: 15px;
        }

        .fallback {
            display: none;
            margin-top: 20px;
        }

        .fallback button {
            width: 100%;
            padding: 13px;
            margin-top: 8px;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            cursor: pointer;
        }

        .naver {
            background-color: #03C75A;
            color: white;
        }

        .google {
            background-color: #4285F4;
            color: white;
        }
    </style>
</head>

<body>

<div class="message-box">

    <h3>길찾기 안내</h3>

    <p>
        현재 위치를 확인하여
    </p>

    <p class="destination">
        영종복합문화센터
    </p>

    <p class="loading" id="status">
        현재 위치를 확인하고 있습니다...
    </p>

    <div class="fallback" id="fallback">

        <p>
            카카오맵 앱이 없는 경우<br>
            아래 지도를 이용해 주세요.
        </p>

        <button class="naver" onclick="openNaver()">
            네이버지도에서 길찾기
        </button>

        <button class="google" onclick="openGoogle()">
            Google 지도에서 길찾기
        </button>

    </div>

</div>


<script>

    // ==========================================
    // 영종복합문화센터 목적지 좌표
    // ==========================================

    const destLat = 37.4805032;
    const destLon = 126.5319946;
    const destName = "영종복합문화센터";


    let currentLat = null;
    let currentLon = null;

    let appOpened = false;


    // ==========================================
    // 현재 위치 확인
    // ==========================================

    function startRouting() {

        if (!navigator.geolocation) {

            showFallback();

            return;
        }


        navigator.geolocation.getCurrentPosition(

            function(position) {

                currentLat = position.coords.latitude;
                currentLon = position.coords.longitude;

                document.getElementById("status").innerHTML =
                    "현재 위치를 확인했습니다.<br>길찾기를 시작합니다.";

                openKakao();

            },

            function(error) {

                document.getElementById("status").innerHTML =
                    "현재 위치를 확인할 수 없습니다.";

                showFallback();

            },

            {
                enableHighAccuracy: true,
                timeout: 10000,
                maximumAge: 0
            }

        );
    }


    // ==========================================
    // 카카오맵 앱 실행
    // ==========================================

    function openKakao() {

        const kakaoUrl =
            "kakaomap://route" +
            "?sp=" + currentLat + "," + currentLon +
            "&ep=" + destLat + "," + destLon +
            "&by=CAR";


        // 앱으로 이동되었는지 감지
        document.addEventListener(
            "visibilitychange",
            function() {

                if (document.hidden) {
                    appOpened = true;
                }

            }
        );


        // 카카오맵 앱 실행 시도
        window.location.href = kakaoUrl;


        // 약 2초 후에도 이 페이지가 보이면
        // 카카오맵 앱이 없는 것으로 판단
        setTimeout(function() {

            if (!appOpened) {

                document.getElementById("status").innerHTML =
                    "카카오맵 앱을 찾을 수 없습니다.<br>" +
                    "아래 지도에서 길찾기를 이용해 주세요.";

                showFallback();

            }

        }, 2000);

    }


    // ==========================================
    // fallback 버튼 표시
    // ==========================================

    function showFallback() {

        document.getElementById("fallback").style.display = "block";

    }


    // ==========================================
    // 네이버지도 웹 길찾기
    // ==========================================

    function openNaver() {

        const url =
            "https://map.naver.com/p/directions/" +
            currentLon + "," + currentLat +
            ",현재위치/" +
            destLon + "," + destLat +
            "," + encodeURIComponent(destName) +
            "/-/car";

        window.location.href = url;

    }


    // ==========================================
    // Google 지도 웹 길찾기
    // ==========================================

    function openGoogle() {

        const url =
            "https://www.google.com/maps/dir/" +
            currentLat + "," + currentLon +
            "/" +
            destLat + "," + destLon;

        window.location.href = url;

    }


    // ==========================================
    // 페이지 로딩 시 자동 실행
    // ==========================================

    window.onload = startRouting;

</script>

</body>
</html>
```
